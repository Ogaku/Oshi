name: FOX Build (optional channel)

# Builds the FOX branch and publishes it as a GitHub *pre-release* tagged `fox-<version>`.
# `releases/latest` (used by the regular app to look for updates) ignores pre-releases, so
# nobody is prompted to update to FOX - only apps that were built from this branch
# (Share.updateChannel == 'fox') follow these releases.

on:
  push:
    branches:
      - FOX
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fox-build
  cancel-in-progress: true

jobs:
  build-fox-android:
    name: Build FOX Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Require release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_FILE_BASE64 secret is missing. FOX builds must be signed with the same key as stable builds, otherwise Android refuses to update the app ('App not installed')."
            exit 1
          fi

      - name: Update versioning and tokens
        id: version
        env:
          APPCENTER_TELEMETRY_TOKEN: ${{ secrets.APPCENTER_TELEMETRY_TOKEN }}
          SZKOLNY_APP_TOKEN: ${{ secrets.SZKOLNY_APP_TOKEN }}
        run: |
          python3 -c "
          import datetime, re, os, time
          today = datetime.date.today().strftime('%Y%m%d')
          build_code = int(time.time())
          build_ver = f'1.1.{today}.{build_code}'

          with open('pubspec.yaml', 'r') as f: c = f.read()
          c = re.sub(r'version: .*', f'version: 1.1.{today}+{build_code}', c)
          with open('pubspec.yaml', 'w') as f: f.write(c)

          with open('lib/share/share.dart', 'r') as f: c = f.read()
          c = c.replace('9.9.9.9', build_ver)
          c = c.replace('AZ_UPDATE_CHANNEL', 'fox')
          with open('lib/share/share.dart', 'w') as f: f.write(c)

          appcenter_token = os.environ.get('APPCENTER_TELEMETRY_TOKEN', '')
          szkolny_token = os.environ.get('SZKOLNY_APP_TOKEN', '')

          with open('lib/share/appcenter.dart', 'r') as f: c = f.read()
          if appcenter_token:
              c = c.replace('AZ_APPCENTER_TELEMETRY_TOKEN', appcenter_token)
          if szkolny_token:
              c = c.replace('AZ_SZKOLNY_APP_TOKEN', szkolny_token)
          with open('lib/share/appcenter.dart', 'w') as f: f.write(c)

          with open(os.environ['GITHUB_OUTPUT'], 'a') as f: f.write(f'version={build_ver}\n')
          "

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PWD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/android/app/upload-keystore.jks"
          echo "storeFile=${{ github.workspace }}/android/app/upload-keystore.jks" > ${{ github.workspace }}/android/keystore.properties
          echo "keyAlias=${KEYSTORE_ALIAS}" >> ${{ github.workspace }}/android/keystore.properties
          echo "storePassword=${KEYSTORE_PWD}" >> ${{ github.workspace }}/android/keystore.properties
          echo "keyPassword=${KEYSTORE_KEY_PWD}" >> ${{ github.workspace }}/android/keystore.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          REQUIRE_RELEASE_SIGNING: "true"
        run: |
          set +e
          flutter build apk --release --android-skip-build-dependency-validation > build_apk.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            ERR_MSG=$(tail -n 35 build_apk.log | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::Android Build Failed:%0A$ERR_MSG"
            echo "### FOX Android Build Failed (Exit code $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_apk.log
            exit $STATUS
          fi
          cp build/app/outputs/flutter-apk/app-release.apk Oshi-FOX.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fox-android-build-log
          path: build_apk.log

      - name: Publish FOX pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fox-${{ steps.version.outputs.version }}
          name: FOX ${{ steps.version.outputs.version }} (optional)
          target_commitish: ${{ github.sha }}
          files: Oshi-FOX.apk
          prerelease: true
          make_latest: "false"
          generate_release_notes: true
          body: |
            **Optional FOX channel build** - not offered as an update to regular users.
            Only installs that already come from the FOX branch are notified about it; to switch, install this APK over the existing app (same package name and signing key).
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prune old FOX pre-releases (keep 5)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --repo "${{ github.repository }}" --exclude-drafts --limit 100 \
            --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease and (.tagName | startswith("fox-"))) | .tagName' \
            | tail -n +6 \
            | xargs -r -I{} gh release delete {} --repo "${{ github.repository }}" --cleanup-tag --yes

