name: Build & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Update versioning and tokens
        env:
          APPCENTER_TELEMETRY_TOKEN: ${{ secrets.APPCENTER_TELEMETRY_TOKEN }}
          SZKOLNY_APP_TOKEN: ${{ secrets.SZKOLNY_APP_TOKEN }}
        run: |
          python3 -c "
          import datetime, re, os
          today = datetime.date.today().strftime('%Y%m%d')
          run_num = '${{ github.run_number }}'
          build_ver = f'1.1.{today}.{run_num}'

          with open('pubspec.yaml', 'r') as f: c = f.read()
          c = re.sub(r'version: .*', f'version: 1.1.{today}+{run_num}', c)
          with open('pubspec.yaml', 'w') as f: f.write(c)

          with open('lib/share/share.dart', 'r') as f: c = f.read()
          c = c.replace('9.9.9.9', build_ver)
          with open('lib/share/share.dart', 'w') as f: f.write(c)

          appcenter_token = os.environ.get('APPCENTER_TELEMETRY_TOKEN', '')
          szkolny_token = os.environ.get('SZKOLNY_APP_TOKEN', '')

          with open('lib/share/appcenter.dart', 'r') as f: c = f.read()
          if appcenter_token:
              c = c.replace('AZ_APPCENTER_TELEMETRY_TOKEN', appcenter_token)
          if szkolny_token:
              c = c.replace('AZ_SZKOLNY_APP_TOKEN', szkolny_token)
          with open('lib/share/appcenter.dart', 'w') as f: f.write(c)
          "

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_FILE_BASE64 }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_PWD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_KEY_PWD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "${{ github.workspace }}/android/app/upload-keystore.jks"
          echo "storeFile=${{ github.workspace }}/android/app/upload-keystore.jks" > ${{ github.workspace }}/android/keystore.properties
          echo "keyAlias=${KEYSTORE_ALIAS}" >> ${{ github.workspace }}/android/keystore.properties
          echo "storePassword=${KEYSTORE_PWD}" >> ${{ github.workspace }}/android/keystore.properties
          echo "keyPassword=${KEYSTORE_KEY_PWD}" >> ${{ github.workspace }}/android/keystore.properties

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          set +e
          flutter build apk --release --android-skip-build-dependency-validation > build_apk.log 2>&1
          STATUS=$?
          if [ $STATUS -ne 0 ]; then
            ERR_MSG=$(tail -n 35 build_apk.log | tr '\r' ' ' | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::Android Build Failed:%0A$ERR_MSG"
            echo "### Android Build Failed (Exit code $STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_apk.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat build_apk.log
            exit $STATUS
          fi
          cp build/app/outputs/flutter-apk/app-release.apk Oshi.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Oshi-Android
          path: Oshi.apk

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build_apk.log

  build-ios:
    name: Build iOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Update versioning and tokens
        env:
          APPCENTER_TELEMETRY_TOKEN: ${{ secrets.APPCENTER_TELEMETRY_TOKEN }}
          SZKOLNY_APP_TOKEN: ${{ secrets.SZKOLNY_APP_TOKEN }}
        run: |
          python3 -c "
          import datetime, re, os
          today = datetime.date.today().strftime('%Y%m%d')
          run_num = '${{ github.run_number }}'
          build_ver = f'1.1.{today}.{run_num}'

          with open('pubspec.yaml', 'r') as f: c = f.read()
          c = re.sub(r'version: .*', f'version: 1.1.{today}+{run_num}', c)
          with open('pubspec.yaml', 'w') as f: f.write(c)

          with open('lib/share/share.dart', 'r') as f: c = f.read()
          c = c.replace('9.9.9.9', build_ver)
          with open('lib/share/share.dart', 'w') as f: f.write(c)

          appcenter_token = os.environ.get('APPCENTER_TELEMETRY_TOKEN', '')
          szkolny_token = os.environ.get('SZKOLNY_APP_TOKEN', '')

          with open('lib/share/appcenter.dart', 'r') as f: c = f.read()
          if appcenter_token:
              c = c.replace('AZ_APPCENTER_TELEMETRY_TOKEN', appcenter_token)
          if szkolny_token:
              c = c.replace('AZ_SZKOLNY_APP_TOKEN', szkolny_token)
          with open('lib/share/appcenter.dart', 'w') as f: f.write(c)
          "

      - name: Install dependencies
        run: |
          flutter config --no-enable-swift-package-manager
          flutter pub get

      - name: Build iOS IPA
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee build_ios.log || true
          if [ -d "./build/ios/iphoneos/Runner.app" ]; then
            cd ./build/ios/iphoneos
            mkdir -p Payload
            cp -r Runner.app Payload/
            zip -r Oshi.ipa Payload
            mv Oshi.ipa "${{ github.workspace }}/Oshi.ipa"
          fi

      - name: Upload IPA artifact
        if: hashFiles('Oshi.ipa') != ''
        uses: actions/upload-artifact@v4
        with:
          name: Oshi-iOS
          path: Oshi.ipa

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: always() && needs.build-android.result == 'success'
    steps:
      - name: Download Android artifact
        uses: actions/download-artifact@v4
        with:
          name: Oshi-Android
          path: release-assets

      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Oshi-iOS
          path: release-assets

      - name: Compute release tag
        id: compute_tag
        run: |
          echo "tag=1.1.$(date '+%Y%m%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.compute_tag.outputs.tag }}
          name: Release ${{ steps.compute_tag.outputs.tag }}
          files: release-assets/*
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Trigger Toudai dispatch
        env:
          DISPATCH_TOKEN: ${{ secrets.PAT || secrets.KEY }}
        if: env.DISPATCH_TOKEN != ''
        run: |
          curl -L -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Ogaku/Toudai/actions/workflows/update.yml/dispatches \
            -d '{"ref":"main","inputs":{}}' || true
