name: Update Extension Index Hashes

on:
  push:
    branches:
      - main
    paths:
      - "dart/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute SHA-256 digests in index.json
        run: |
          python3 -c '
          import hashlib, json, pathlib

          index_path = pathlib.Path("index.json")
          entries = json.loads(index_path.read_text(encoding="utf-8"))
          for entry in entries:
              url = entry.get("sourceCodeUrl", "")
              if "/main/" in url:
                  rel = url.split("/main/", 1)[1]
                  p = pathlib.Path(rel)
                  if p.exists():
                      entry["sha256"] = hashlib.sha256(p.read_bytes()).hexdigest()

          index_path.write_text(json.dumps(entries, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          '

      - name: Commit updated index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet index.json; then
            git add index.json
            git commit -m "chore: update sha256 digests in index.json"
            git push
          fi

